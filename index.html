<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://192.168.1.1">
  <title>Acceso al Módem</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    a {
      color: #ffffff;
      background-color: #1e3a8a;
      padding: 20px 40px;
      border-radius: 12px;
      font-size: 28px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    a:hover {
      background-color: #2748ab;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <a href="http://192.168.1.1">🔧 Toque aquí para abrir el módem</a>
</body>
</html>
